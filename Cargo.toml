[workspace]
resolver = "2"
members = ["crates/z-common", "crates/z-db", "crates/z-node", "crates/z-panel"]
# zray-core is its own workspace; its crates inherit from its manifest.
exclude = ["resources"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/z-ui/z-ui"

[workspace.dependencies]
z-common = { path = "crates/z-common" }
z-db = { path = "crates/z-db" }
z-node = { path = "crates/z-node" }

# zray-core, from its checkout next to the panel (see README.md).
zero-runtime = { path = "resources/ZeroNet/crates/zero-runtime" }
zero-config = { path = "resources/ZeroNet/crates/zero-config" }
zero-core = { path = "resources/ZeroNet/crates/zero-core" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "set-header"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros"] }
argon2 = "0.6"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

# zray-core patches crates.io dependencies, and Cargo applies only the root
# workspace's patches: the panel must carry the same ones. Keep in step with
# resources/ZeroNet/Cargo.toml.
[patch.crates-io]
rustls = { path = "resources/ZeroNet/vendor/rustls" }
netstack-smoltcp = { path = "resources/ZeroNet/vendor/netstack-smoltcp" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = "s"

[profile.release.package.smoltcp]
opt-level = 3
[profile.release.package.netstack-smoltcp]
opt-level = 3

# Argon2 is meant to be slow; unoptimised it is slow enough to drag every
# test that signs in.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
