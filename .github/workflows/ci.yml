name: CI

on:
  push:
  pull_request:

env:
  # zray-core, checked out where the workspace expects it (resources/zray-core).
  CORE_REPOSITORY: ZeroNetTeam/Zray-Core
  CORE_REF: main
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: resources/zray-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The installer and the menu: shellcheck, then a whole install into a
      # temporary root with the program just built.
      - run: shellcheck -S error install.sh deploy/z-ui.sh deploy/tests/run.sh
      - run: cargo build -p z-panel
      - run: bash deploy/tests/run.sh

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
